<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #090D16; font-family: system-ui, sans-serif; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .card { width: 500px; height: 420px; background: linear-gradient(180deg, #1E293B, #0F172A); border: 2px solid #334155; border-radius: 24px; padding: 24px; box-sizing: border-box; margin: 15px; position: relative; }
  .badge { display: inline-block; padding: 6px 14px; background: rgba(99, 102, 241, 0.2); border: 1px solid #6366F1; border-radius: 10px; color: #C7D2FE; font-size: 13px; font-weight: 700; margin-right: 10px; }
  .badge-linear { background: rgba(6, 182, 212, 0.2); border-color: #06B6D4; color: #A5F3FC; }
  .title { font-size: 18px; font-weight: 700; color: #F8FAFC; vertical-align: middle; }
  .dial-center { position: absolute; top: 230px; left: 250px; transform: translate(-50%, -50%); text-anchor: middle; text-align: center; }
</style>
</head>
<body>
<div style="display: flex;">
  <!-- Circular View Card -->
  <div class="card">
    <div><span class="badge">🕒 CIRCULAR DIAL</span><span class="title">CircularTimeSpanSelector</span></div>
    <svg width="450" height="320" style="margin-top: 15px;">
      <!-- Track -->
      <circle cx="225" cy="160" r="125" fill="none" stroke="#334155" stroke-width="16"/>
      <!-- Active Arc -->
      <path id="circularArc" fill="none" stroke="url(#grad1)" stroke-width="20" stroke-linecap="round" d="M 136 71 A 125 125 0 1 1 333 222"/>
      <!-- Start Thumb -->
      <circle id="startThumb" cx="136" cy="71" r="16" fill="#FFFFFF" stroke="#6366F1" stroke-width="6"/>
      <!-- End Thumb -->
      <circle id="endThumb" cx="333" cy="222" r="16" fill="#FFFFFF" stroke="#06B6D4" stroke-width="6"/>
      <!-- Center Display -->
      <g transform="translate(225, 160)">
        <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
        <text x="0" y="-8" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">ACTIVE TIME SPAN</text>
        <text id="timeText" x="0" y="10" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">08:30 AM – 05:00 PM</text>
        <text id="durationText" x="0" y="24" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle">Duration: 8h 30m</text>
      </g>
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6366F1"/>
          <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- Linear View Card -->
  <div class="card">
    <div><span class="badge badge-linear">📏 LINEAR SLIDER</span><span class="title">LinearTimeSpanSelector</span></div>
    <svg width="450" height="320" style="margin-top: 15px;">
      <line x1="30" y1="140" x2="420" y2="140" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
      <line id="linearActive" x1="150" y1="140" x2="310" y2="140" stroke="url(#grad2)" stroke-width="18" stroke-linecap="round"/>
      <circle id="linearStart" cx="150" cy="140" r="16" fill="#FFFFFF" stroke="#06B6D4" stroke-width="6"/>
      <circle id="linearEnd" cx="310" cy="140" r="16" fill="#FFFFFF" stroke="#10B981" stroke-width="6"/>
      <!-- Display Badge -->
      <g transform="translate(225, 230)">
        <rect x="-95" y="-25" width="190" height="54" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
        <text x="0" y="-6" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">SELECTED SPAN</text>
        <text id="linearTimeText" x="0" y="10" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">09:00 AM – 05:00 PM</text>
        <text x="0" y="22" fill="#34D399" font-size="10" font-weight="600" text-anchor="middle">Total Duration: 8h 00m</text>
      </g>
      <defs>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#06B6D4"/>
          <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
</div>
</body>
</html>
