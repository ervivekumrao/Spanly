    <circle cx="128" cy="128" r="92" fill="none" stroke="#334155" stroke-width="18" stroke-dasharray="8 8"/>
    <path fill="none" stroke="url(#favGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
          d="M 172 70 A 46 46 0 0 0 82 84 C 82 118 174 138 174 172 A 46 46 0 0 1 84 186"/>
    <circle cx="172" cy="70" r="18" fill="#6366F1"/>
    <circle cx="84" cy="186" r="18" fill="#06B6D4"/>
